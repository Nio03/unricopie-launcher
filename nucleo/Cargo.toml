[package]
name = "unricopie-nucleo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Núcleo de Unricopie, sin interfaz: lo comparten el launcher y el banco de pruebas."

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: al reescribir el JSON de un juego, sus claves quedan en el mismo orden.
serde_json = { version = "1", features = ["preserve_order"] }
# Para tocar una clave del toml de un juego sin perder sus comentarios ni su orden.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
semver = { version = "1", features = ["serde"] }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
url = "2"
dirs = "6"
# 7z y xz en Rust puro, sin cifrado ni los métodos raros: solo LZMA, LZMA2 y sus filtros.
sevenz-rust2 = { version = "0.24", default-features = false }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization", "xz"] }

[dev-dependencies]
tempfile = "3"
# Para hacer 7z y xz de prueba.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization", "xz", "encoder"] }

[target."cfg(windows)".dependencies]
known-folders = "1"
